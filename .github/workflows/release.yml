name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  artifact:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # osx-x64 (Intel Mac) dropped for v0.1: Apple stopped selling Intel Macs in 2023
        # and local-model users are all on Apple Silicon. Intel holdouts can build from
        # source. Also sidesteps the retired macos-13 smoke runner (phase-6 D3 fallback).
        rid: [win-x64, linux-x64, linux-arm64, osx-arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: dotnet publish src/Vessel/Vessel.csproj -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -p:PublishTrimmed=true -o publish/${{ matrix.rid }}
      - name: Package artifact
        shell: bash
        run: |
          version="$(git describe --tags --always | sed 's/^v//')"
          stage="vessel-${version}-${{ matrix.rid }}"
          mkdir "$stage"
          if [[ '${{ matrix.rid }}' == win-* ]]; then
            cp publish/${{ matrix.rid }}/Vessel.exe "$stage/vessel.exe"
          else
            cp publish/${{ matrix.rid }}/Vessel "$stage/vessel"
          fi
          cp LICENSE "$stage/LICENSE"
          printf 'Vessel documentation: https://github.com/spenceclark/Vessel\n' > "$stage/README.txt"
          if [[ '${{ matrix.rid }}' == win-* ]]; then zip -r "${stage}.zip" "$stage"; else tar -czf "${stage}.tar.gz" "$stage"; fi
          sha256sum "${stage}".* > "${stage}.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vessel-${{ matrix.rid }}
          path: vessel-*-${{ matrix.rid }}.*

  smoke:
    needs: artifact
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: osx-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vessel-${{ matrix.rid }}
          path: download
      - shell: bash
        run: |
          archive="$(find download -type f \( -name '*.zip' -o -name '*.tar.gz' \) | head -1)"
          mkdir -p unpacked
          if [[ "$archive" == *.zip ]]; then unzip -q "$archive" -d unpacked; else tar -xzf "$archive" -C unpacked; fi
          chmod +x unpacked/*/vessel 2>/dev/null || true
          bash verify/publish-smoke.sh --artifact-dir unpacked/*

  container-smoke:
    needs: artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - run: docker build --tag vessel:test .
      - name: Verify image state and compose example
        run: |
          set -x  # trace every command so a failing assertion is named in the CI log
          docker network create vessel-smoke
          docker run -d --name vessel-stub --network vessel-smoke node:22-alpine node -e 'require("http").createServer((q,r)=>r.end("container-smoke")).listen(11434,"0.0.0.0")'
          mkdir container-state
          printf '%s\n' '{"listen":"0.0.0.0:4550","defaultBackend":"stub","backends":{"stub":{"baseUrl":"http://vessel-stub:11434","type":"ollama"}}}' > container-state/vessel.json
          docker run -d --name vessel-test --network vessel-smoke -p 4550:4550 -v "$PWD/container-state:/data" vessel:test
          echo "assert: vessel serves status"
          for i in {1..60}; do curl --fail --silent http://127.0.0.1:4550/vessel/api/status && break; sleep .25; done
          curl --fail --silent http://127.0.0.1:4550/vessel/api/status || { echo "vessel-test never became ready — container logs:"; docker logs vessel-test; exit 1; }
          echo "assert: vessel.db persisted to the mounted volume"
          test -f container-state/vessel.db
          # Wait for the stub to become reachable through vessel before asserting — the stub
          # container comes up independently of vessel and may not be listening yet.
          echo "assert: a proxied request reaches the stub"
          for i in {1..60}; do [ "$(curl --fail --silent http://127.0.0.1:4550/container-smoke || true)" = container-smoke ] && break; sleep .25; done
          test "$(curl --fail --silent http://127.0.0.1:4550/container-smoke)" = container-smoke
          echo "assert: state survives a container restart"
          docker restart vessel-test
          for i in {1..60}; do curl --fail --silent http://127.0.0.1:4550/vessel/api/status && break; sleep .25; done
          curl --fail --silent http://127.0.0.1:4550/vessel/api/status
          docker rm -f vessel-test vessel-stub
          echo "assert: the shipped compose file brings vessel up"
          VESSEL_IMAGE=vessel:test docker compose up -d
          for i in {1..60}; do curl --fail --silent http://127.0.0.1:4550/vessel/api/status && break; sleep .25; done
          curl --fail --silent http://127.0.0.1:4550/vessel/api/status
          docker compose ps vessel
          VESSEL_IMAGE=vessel:test docker compose down -v

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [smoke, container-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release
          merge-multiple: true
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/vessel:${{ github.ref_name }},ghcr.io/${{ github.repository_owner }}/vessel:latest
      # Release body = only the newest CHANGELOG section (first "## " heading up to the next).
      - name: Extract release notes
        run: awk '/^## /{n++} n==1' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          body_path: notes.md
          files: release/*
